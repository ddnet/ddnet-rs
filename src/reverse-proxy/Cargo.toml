[package]
name = "reverse-proxy"
default-run = "reverse-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "legacy-server-proxy"
path = "src/legacy_main.rs"

[dependencies]
base = { path = "../../lib/base" }
base-fs = { path = "../../lib/base-fs", default-features = false }
base-io = { path = "../../lib/base-io" }
base-io-traits = { path = "../../lib/base-io-traits" }
network = { path = "../../lib/network" }

game-base = { path = "../../game/game-base" }
legacy-proxy = { path = "../../game/legacy-proxy" }
master-server-types = { path = "../../game/master-server-types" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hex = "0.4"
quinn = { git = "https://github.com/Jupeyy/quinn", rev = "8a5fc90badd30f35025a8beac08037605665ee21", default-features = false, features = [
  "runtime-tokio",
  "rustls",
  "ring",
] }
rand = { version = "0.10", features = ["thread_rng"], default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "io-util",
  "sync",
  "time",
] }
x509-cert = "0.2"
url = "2"

bin-patch = { path = "../../lib/bin-patch" }
math = { path = "../../lib/math" }
pool = { path = "../../lib/pool" }

game-interface = { path = "../../game/game-interface" }
game-network = { path = "../../game/game-network" }
vanilla = { path = "../../game/vanilla" }
map = { path = "../../game/map" }
map-convert-lib = { path = "../../game/map-convert-lib" }

libtw2-gamenet-ddnet = { git = "https://github.com/Jupeyy/libtw2.git", rev = "0b6b1b7533dc00c48483dca51eedf04656efb66d" }
libtw2-net = { git = "https://github.com/Jupeyy/libtw2.git", rev = "0b6b1b7533dc00c48483dca51eedf04656efb66d" }
libtw2-packer = { git = "https://github.com/Jupeyy/libtw2.git", rev = "0b6b1b7533dc00c48483dca51eedf04656efb66d" }
libtw2-snapshot = { git = "https://github.com/Jupeyy/libtw2.git", rev = "0b6b1b7533dc00c48483dca51eedf04656efb66d" }

arrayvec = "=0.5.2"
bincode = { version = "2", features = ["serde"] }
warn = "0.2"
rayon = "1"
crc32fast = "1"
zstd = "0.13"

[dev-dependencies]
arc-swap = "1"
axum = "0.8"
game-server = { path = "../../game/game-server" }
tempfile = "3"
